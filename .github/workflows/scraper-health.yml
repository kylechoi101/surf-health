name: Scraper health (14-day streak)

# Runs right after every daily-forecast run finishes, to measure whether the
# advisory pipeline produced trustworthy data. Maintains a streak counter in
# data/curated/scraper_health.json so the next UX iteration (spec I:
# naming the flagged station) has a queryable gate to wait on.
#
# Designed to ALWAYS exit success — alarms are signaled via the committed
# JSON, not via workflow status, so we don't get a sea of red runs when
# scrapers misbehave. The daily-forecast workflow itself is the gate that
# fails loudly on its own assertions.

on:
  # Chained to the forecast's COMPLETION, not to a clock. This used to be a
  # 16:30 UTC cron "30 min after the forecast cron", but GitHub starts the
  # forecast's schedule 2-4 h late and the run takes ~55-85 min, so on 5 of 5
  # days checked (2026-09-11..15) this ran while the forecast was still
  # mid-flight and graded the PREVIOUS day's data. The unresolved-drop check
  # only counts rows scraped today, so it saw none and read clean.
  # The old `push` trigger could not rescue it: the forecast commits with
  # GITHUB_TOKEN, and those pushes never start workflows (0 of the last 40
  # runs were push-triggered).
  #
  # Matched by NAME: renaming daily-forecast.yml's `name:` silently breaks this
  # chain. backend/tests/test_scraper_health_check.py pins the two together.
  workflow_run:
    workflows: ["Daily forecast refresh"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A cron forecast and a code-push forecast finishing close together must not
# race each other's streak commit.
concurrency:
  group: scraper-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The forecast's data commit lands on main during its run; check out
          # main's tip, not the SHA the forecast started from.
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: pip install --quiet pandas pyarrow

      - name: Run scraper-health check
        env:
          # success / failure / cancelled / timed_out ... Empty on a manual
          # dispatch, in which case the script skips the conclusion check.
          FORECAST_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python backend/scripts/scraper_health_check.py \
            --curated data/curated \
            --out data/curated/scraper_health.json \
            --forecast-conclusion "$FORECAST_CONCLUSION"

      - name: Commit updated streak file
        run: |
          if [ -z "$(git status --porcelain data/curated/scraper_health.json)" ]; then
            echo "no streak change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/curated/scraper_health.json
          STREAK=$(python -c "import json; print(json.load(open('data/curated/scraper_health.json'))['consecutive_clean_days'])")
          READY=$(python -c "import json; print(json.load(open('data/curated/scraper_health.json'))['ready_for_station_naming_spec_i'])")
          git commit -m "chore(scraper-health): streak=${STREAK} ready_for_spec_i=${READY}" -m "Auto-generated by scraper-health workflow."
          # Retry, same loop as daily-forecast.yml's commit step. This now runs
          # minutes after the forecast's own push, and closures-refresh pushes
          # hourly, so main can move between checkout and push.
          # -X theirs: on rebase "theirs" is our commit, which only touches the
          # streak file this job just regenerated.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main; then
              if git push origin HEAD:main; then
                echo "pushed (attempt ${attempt})"
                exit 0
              fi
              echo "push rejected; origin/main moved, re-basing (attempt ${attempt})"
            else
              echo "rebase failed; aborting before retry (attempt ${attempt})"
              git rebase --abort || true
            fi
            sleep $(( attempt * 5 ))
          done
          echo "::error::could not push scraper-health streak after 5 attempts"
          exit 1
