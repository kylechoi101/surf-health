name: Daily forecast refresh

on:
  schedule:
    - cron: '0 16 * * *'   # 9 AM PDT / 8 AM PST — gives data.ca.gov BeachWatch
                            # ETL several hours of buffer after overnight refresh
  push:
    branches: [main]
    paths:
      # Auto-fire ONLY when the pipeline code in backend/app/** changes.
      # Scraper-only or tool-only edits (backend/scripts/**, scripts/**) and
      # dependency bumps used to auto-fire this 30-min refresh on every push;
      # those should now run via workflow_dispatch or wait for the daily cron.
      - '.github/workflows/daily-forecast.yml'
      - 'backend/app/**'
  workflow_dispatch:
    inputs:
      full_comparison:
        description: >-
          Run the FULL model comparison (re-select the production winner across
          all candidates) instead of the fast winner-only retrain. Use this once
          to promote a newly-added model (e.g. xgb_undersample_ensemble); daily
          runs stay winner-only.
        type: boolean
        default: false

# Never kill a mid-flight training/commit run — let it finish and queue the
# next one. cancel-in-progress: false is deliberate: a cancelled run would
# leave a half-written forecast (no commit) and stale /system/health -> 503.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        # -c constraints.txt pins the portable scientific stack
        # (numpy/pandas/scikit-learn/xgboost/...) to the last-validated daily-run
        # versions so a fresh PyPI resolve can't silently shift calibrated
        # probabilities between runs. Relative path resolves under working-directory.
        run: pip install -e ".[training]" -c constraints.txt
        working-directory: backend

      - name: Restore hydrology cache
        uses: actions/cache@v6
        with:
          path: |
            data/raw/usgs_streamflow
            data/raw/cnrfc
            data/raw/stormwater
          key: hydro-${{ runner.os }}-v4
          restore-keys: hydro-${{ runner.os }}-

      - name: Create data directories
        run: mkdir -p data/curated data/raw/cnrfc data/raw/usgs_streamflow data/raw/nhdplus data/raw/stormwater

      - name: Fetch BeachWatch CSVs from data.ca.gov
        run: |
          curl -fsSL -o /tmp/bw_stations.csv \
            'https://data.ca.gov/dataset/b9c8ce91-40ff-4ad3-8164-bc17c46afb44/resource/98e628ff-d012-4982-ad32-b9f9ad8ab524/download/beach-monitoring-stations.csv'
          curl -fsSL -o /tmp/bw_results.csv \
            'https://data.ca.gov/dataset/b9c8ce91-40ff-4ad3-8164-bc17c46afb44/resource/7bd961cf-abe4-433b-8033-378161237ff3/download/beach-monitoring-results.csv'
          curl -fsSL -o /tmp/bw_advisories.csv \
            'https://data.ca.gov/dataset/b9c8ce91-40ff-4ad3-8164-bc17c46afb44/resource/d5cd6a23-829c-426d-a63e-689a55a3db9c/download/beach-advisories.csv'

      - name: Fetch Safe to Swim CEDEN results for stormwater features
        # data.ca.gov's CKAN file-store occasionally serves a 302 with a malformed
        # `Location:` header (filename as host, no scheme), so the raw CSV download
        # is unreliable. The datastore JSON API stays healthy through those incidents
        # — see scripts/fetch_safetoswim_geomeans.py for the replacement.
        # Stormwater is a soft dep downstream (continue-on-error: true), so we tolerate
        # transient CKAN failures here without killing the daily pipeline.
        continue-on-error: true
        working-directory: backend
        run: |
          python scripts/fetch_safetoswim_geomeans.py \
            --output ../data/raw/safetoswim_geomeans_2020-present.csv \
            --skip-if-exists

      - name: Snapshot previous serving artifacts (drift baseline + release-gate fallback)
        # Capture the last-committed forecast + hourly BEFORE the pipeline runs.
        # forecasts.parquet feeds validate_forecast.py's --previous drift check;
        # hourly_forecast.parquet is restored later when the release gate blocks
        # publication (the data pipeline regenerates hourly unconditionally, so a
        # fresh hourly must not leak under a blocked safety forecast). || true:
        # on the very first run these files do not exist yet.
        run: |
          cp data/curated/forecasts.parquet /tmp/prev_forecasts.parquet || true
          cp data/curated/hourly_forecast.parquet /tmp/prev_hourly_forecast.parquet || true

      - name: Run data pipeline
        run: |
          python -m app.data.pipeline.cli \
            --normalize-beachwatch \
            --stations-csv /tmp/bw_stations.csv \
            --results-csv /tmp/bw_results.csv \
            --advisories-csv /tmp/bw_advisories.csv \
            --merge-ceden \
            --max-ceden-rows 50000 \
            --force-ceden-fetch \
            --with-external-covariates \
            --with-hydrology \
            --with-solar-wind \
            --with-surf \
            --with-hourly
        working-directory: backend

      - name: Fetch county-direct advisories (overrides stale state feed)
        # The data.ca.gov BeachWatch dataset lags county postings by weeks.
        # This step scrapes the SD County DEH page (sdbeachinfo.com) for live
        # postings and rewrites advisories.parquet's "active" records for any
        # beach the county currently has posted. Must run AFTER the state
        # ingest (which writes advisories.parquet) and BEFORE training (which
        # consumes it as a feature).
        #
        # G.1: this step is NOT continue-on-error. The script self-fails (exit 1)
        # only when its name-resolution observability gate trips (unresolved
        # advisories > 5 absolute OR > 10% of scraped). Transient per-county
        # HTTP failures are absorbed inside the script's RetryingClient and the
        # CountyReport telemetry, so the only way the script returns non-zero
        # is the explicit operability signal we want to surface.
        run: |
          python scripts/fetch_county_advisories.py --curated ../data/curated/
        working-directory: backend

      - name: Run stormwater/outfall feature pipeline
        # External ArcGIS endpoints (e.g. Orange County) occasionally return 500/503.
        # Don't fail the whole daily pipeline over a transient upstream outage —
        # cached parquets from the previous run carry the model through.
        continue-on-error: true
        run: |
          python -m app.data.pipeline.stormwater \
            --curated-dir ../data/curated \
            --raw-dir ../data/raw/stormwater \
            --download \
            --ceden-results-csv ../data/raw/safetoswim_geomeans_2020-present.csv
        working-directory: backend

      - name: Run ML training + forecasts
        # NOT continue-on-error: a failed training/forecast run must abort the
        # job loudly. set -e ensures any non-zero exit inside this block (not
        # just the final python call) fails the step rather than silently
        # falling through to a no-op commit of the previous run's stale forecast.
        run: |
          set -euo pipefail
          FORECAST_DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          # winner-only is the fast daily path (retrain the registry winner).
          # A manual full_comparison=true run re-selects the winner across all
          # candidates — used to promote a newly-added model into the registry.
          WINNER_FLAG="--winner-only"
          # Daily spatial backtests are kept (the public-release eligibility gate
          # needs spatial-holdout metrics) but at a reduced fold count: at 1095d
          # (~84k rows) the full 12-county + 50-beach sweep is ~60 retrains and
          # overran the 95 min of ML budget, timing the whole job out (no fresh
          # forecast committed -> /system/health goes stale -> 503). 6 counties +
          # 15 beaches still yields valid spatial metrics that pass the gate.
          BACKTEST_FLAGS="--spatial-backtests --spatial-strategy shortlist --spatial-county-limit 6 --spatial-beach-limit 15"
          if [ "${{ github.event.inputs.full_comparison }}" = "true" ]; then
            WINNER_FLAG=""
            BACKTEST_FLAGS="--spatial-backtests --spatial-strategy shortlist --spatial-county-limit 12 --spatial-beach-limit 50"
            echo "::notice::Running FULL model comparison (winner re-selection)"
          fi
          # Training window 365 -> 1095d (2026-06-08): 365d starved the SPATIAL fit.
          # Isolation (spatial_compare): full-history +marine 0.612 vs 365d 0.567.
          # Gate retrain @1095d: xgb_undersample_ensemble held-out county AUCPR
          # 0.507 -> 0.590, beach 0.881 -> 0.900 (hist_gbm does NOT benefit: 0.500 -> 0.478).
          # 1095d ~= 84k rows, all feature-rich post-2020 history.
          # --enforce-release-gate: when the promotion assessment finds the model
          # ineligible (spatial-holdout gate fails), SKIP overwriting
          # forecasts.parquet so the last-validated forecast keeps serving. The
          # blockers still land in system_health.json; the verify_release_gate.py
          # step (after the commit) then fails the job to fire the alert.
          python -m app.ml.training --curated --forecast-date "$FORECAST_DATE" $WINNER_FLAG $BACKTEST_FLAGS --training-window-days 1095 --forecast-min-recency-days 45 --enforce-release-gate
        working-directory: backend

      - name: Honor release gate for hourly forecast
        # When --enforce-release-gate blocked publication, training left
        # forecasts.parquet at the previous run's values. Restore the previous
        # hourly_forecast.parquet too so the whole last-validated serving snapshot
        # stays coherent — the data pipeline regenerates hourly unconditionally
        # before training, so a fresh hourly would otherwise ship under a blocked
        # safety forecast. Best-effort restore; never fails the job here (the
        # verify_release_gate.py step after the commit is what fails it).
        run: |
          if python scripts/verify_release_gate.py --curated ../data/curated/ >/dev/null 2>&1; then
            echo "Release gate passed — keeping freshly built hourly_forecast.parquet."
          else
            echo "::warning::Release gate blocked publication — restoring previous hourly_forecast.parquet."
            cp /tmp/prev_hourly_forecast.parquet ../data/curated/hourly_forecast.parquet || true
          fi
        working-directory: backend

      - name: Validate forecast (abort before committing a bad/stale run)
        # Guards the freshly written forecasts.parquet BEFORE any downstream
        # consumer (audit, serving_snapshot) or the git-commit step runs. Fails
        # the job (exit 1) on a missing/unparseable/empty/truncated/degenerate
        # or stale forecast, so a silent training failure can never ship a
        # no-op commit of the previous run's stale data. NOT continue-on-error.
        # --previous compares against the pre-pipeline snapshot for distribution
        # drift (and tolerates the release-gate "unchanged forecast" case).
        run: |
          python scripts/validate_forecast.py --curated ../data/curated/ --previous /tmp/prev_forecasts.parquet
        working-directory: backend

      - name: Forecast-time weather pull (100% wind/UV coverage)
        run: |
          FORECAST_DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          python scripts/refresh_latest_env_weather.py --forecast-date "$FORECAST_DATE"
        working-directory: backend
        continue-on-error: true

      - name: G.2 auto-expire zombie active advisories
        # MUST run before the audit step. The auto_expire_zombie_advisories()
        # function is also called inside the serving_snapshot bake later in
        # the workflow, but that step runs AFTER the audit gate — too late.
        # This standalone invocation demotes >14-day-old active rows
        # (excluding Chronic Posting) in-place on advisories.parquet so the
        # subsequent audit reads the corrected state.
        run: |
          python scripts/auto_expire_advisories.py \
            --advisories ../data/curated/advisories.parquet
        working-directory: backend

      - name: Audit forecasts vs advisories
        run: |
          python scripts/audit_forecasts_vs_advisories.py \
            --curated ../data/curated/
        working-directory: backend

      - name: Audit gate — fail on zombie active advisories (G.4)
        # G.2's auto-expire (in serving_snapshot) should keep this at zero.
        # If it doesn't, something is wrong with the demote pipeline — fail
        # the workflow so we notice before the bad data ships to prod.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          audit_path = Path("../data/curated/advisory_audit.json")
          if not audit_path.exists():
              print("advisory_audit.json not produced; skipping G.4 gate")
              sys.exit(0)
          audit = json.loads(audit_path.read_text())

          zombies = []
          # The audit JSON ships per-pool sample rows under
          # false_negatives.worst_acute / worst_chronic. We scan every list
          # of rows that carries advisory_age_days and count anything > 30d.
          fn = audit.get("false_negatives") or {}
          for key in ("worst_acute", "worst_chronic"):
              for row in (fn.get(key) or []):
                  age = row.get("advisory_age_days")
                  if isinstance(age, (int, float)) and age > 30:
                      zombies.append(row)

          if zombies:
              print("FAIL (G.4): zombie active advisories with age_days > 30 detected:", file=sys.stderr)
              for z in zombies[:20]:
                  print(f"  beach_id={z.get('beach_id')} age_days={z.get('advisory_age_days')} pool={z.get('pool')}", file=sys.stderr)
              print(
                  f"\nG.2 auto-expire should have demoted these. "
                  f"Inspect serving_snapshot.auto_expire_zombie_advisories logs to debug.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("G.4 gate passed: no zombie active advisories above 30d.")
          PY
        working-directory: backend

      - name: Build API serving snapshot
        run: python -m app.data.pipeline.serving_snapshot --curated ../data/curated/
        working-directory: backend

      # Web static data baking moved to kylechoi101/shorelife-web private repo.
      # That repo's CI pulls data/curated/ from this public repo via the
      # GitHub raw URL and bakes its own static export.

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/curated/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            FORECAST_DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
            git commit -m "chore: daily forecast refresh ${FORECAST_DATE}"
            # -X theirs: on rebase, "theirs" = our local commit. Binary files
            # like serving.sqlite can't auto-merge — always prefer the freshly
            # regenerated version produced by this pipeline run.
            git pull --rebase --autostash -X theirs origin main
            git push
          fi

      - name: Verify public release gate (fail the job if publication was blocked)
        # MUST run AFTER the commit/push: when --enforce-release-gate blocks
        # publication, the system_health.json update (with the blockers) has to
        # reach the repo for auditability FIRST; only then does this non-zero exit
        # fail the job so the notify-failure job opens the pipeline-failure issue.
        # NOT continue-on-error — the whole point is to surface the block loudly.
        run: python scripts/verify_release_gate.py --curated ../data/curated/
        working-directory: backend

      - name: Trigger Render deploy
        if: success()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK not set — skipping (set repo secret to enable)."
          fi

  # Failure alerting: the daily pipeline failing used to be silent — the only
  # signal was someone manually checking Actions or the API serving a 503.
  # This job opens (or, to avoid spamming a multi-day outage, comments on an
  # already-open) GitHub Issue labelled `pipeline-failure`, assigned to the
  # repo owner. GitHub emails issue assignees/watchers, so this is a guaranteed
  # notification with ZERO external secrets (no Slack/PagerDuty needed).
  notify-failure:
    needs: refresh
    # A 170-min `timeout-minutes` kill records the job conclusion as CANCELLED,
    # which failure() does NOT match — so cancelled() is included here, otherwise
    # a timeout (a documented recurring failure mode) would fire no alert at all.
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # contents:read so github-script can read the repo; issues:write to
      # open/comment on the alert issue. Both scoped to this job only.
      contents: read
      issues: write
    steps:
      - name: Open or update pipeline-failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // YYYY-MM-DD in UTC — stable per-day title so a same-day re-run
            // de-dupes onto the existing issue rather than opening a new one.
            const today = new Date().toISOString().slice(0, 10);
            const label = 'pipeline-failure';
            const title = `🔴 daily-forecast failed ${today}`;
            const body = [
              `The **Daily forecast refresh** workflow failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              `- Triggered by: \`${context.eventName}\``,
              ``,
              `A failed run means no fresh forecast was committed — \`/system/health\` may go stale (503). Inspect the run log above, then re-run via \`workflow_dispatch\`.`,
            ].join('\n');

            // Ensure the de-dupe label exists (idempotent — ignore "already exists").
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd73a4a',
                description: 'Automated daily/closures pipeline failure alert',
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

            // De-dupe: if ANY open issue already carries the label, comment on
            // the most recent one instead of opening a fresh issue. This keeps
            // a multi-day outage to a single thread + comments, not N issues.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              sort: 'created',
              direction: 'desc',
              per_page: 1,
            });

            if (open.data.length > 0) {
              const existing = open.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing — another run failed ${today}.\n\n${body}`,
              });
              core.notice(`Commented on existing failure issue #${existing.number}`);
            } else {
              const base = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              };
              // Assign the repo owner so GitHub emails them directly. If the
              // owner isn't an assignable user (e.g. an org), the API 422s —
              // fall back to an unassigned issue so the alert is never lost.
              let created;
              try {
                created = await github.rest.issues.create({ ...base, assignees: [context.repo.owner] });
              } catch (e) {
                if (e.status !== 422) throw e;
                created = await github.rest.issues.create(base);
              }
              core.notice(`Opened failure issue #${created.data.number}`);
            }

  # Recovery alerting: notify-failure opens/comments a `pipeline-failure` issue
  # but NOTHING closed it on a later success, so the issue state never reflected
  # recovery and a muted long-lived thread buried new failures. This job runs on
  # a successful refresh, comments "recovered" on every OPEN `pipeline-failure`
  # issue, and closes it — so the issue tracker reflects the live pipeline state.
  notify-recovery:
    needs: refresh
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      # contents:read so github-script can read the repo; issues:write to
      # comment on / close the recovered alert issues. Both scoped to this job.
      contents: read
      issues: write
    steps:
      - name: Close recovered pipeline-failure issues
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // YYYY-MM-DD in UTC — same date format the failure job uses.
            const today = new Date().toISOString().slice(0, 10);
            const label = 'pipeline-failure';

            // List ALL open issues carrying the label (paginated) and close each
            // one — a multi-day outage may have left more than one thread.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });

            if (open.length === 0) {
              core.notice('No open pipeline-failure issues to close.');
              return;
            }

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Pipeline recovered — run ${runUrl} on ${today} succeeded. Closing this alert.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.notice(`Closed recovered failure issue #${issue.number}`);
            }
