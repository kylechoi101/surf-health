name: Daily forecast refresh

on:
  schedule:
    - cron: '0 16 * * *'   # 9 AM PDT / 8 AM PST — gives data.ca.gov BeachWatch
                            # ETL several hours of buffer after overnight refresh
  push:
    branches: [main]
    paths:
      # Auto-fire ONLY when the pipeline code in backend/app/** changes.
      # Scraper-only or tool-only edits (backend/scripts/**, scripts/**) and
      # dependency bumps used to auto-fire this 30-min refresh on every push;
      # those should now run via workflow_dispatch or wait for the daily cron.
      - '.github/workflows/daily-forecast.yml'
      - 'backend/app/**'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[training]"
        working-directory: backend

      - name: Restore hydrology cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/usgs_streamflow
            data/raw/cnrfc
            data/raw/stormwater
          key: hydro-${{ runner.os }}-v4
          restore-keys: hydro-${{ runner.os }}-

      - name: Create data directories
        run: mkdir -p data/curated data/raw/cnrfc data/raw/usgs_streamflow data/raw/nhdplus data/raw/stormwater

      - name: Fetch BeachWatch CSVs from data.ca.gov
        run: |
          curl -fsSL -o /tmp/bw_stations.csv \
            'https://data.ca.gov/dataset/b9c8ce91-40ff-4ad3-8164-bc17c46afb44/resource/98e628ff-d012-4982-ad32-b9f9ad8ab524/download/beach-monitoring-stations.csv'
          curl -fsSL -o /tmp/bw_results.csv \
            'https://data.ca.gov/dataset/b9c8ce91-40ff-4ad3-8164-bc17c46afb44/resource/7bd961cf-abe4-433b-8033-378161237ff3/download/beach-monitoring-results.csv'
          curl -fsSL -o /tmp/bw_advisories.csv \
            'https://data.ca.gov/dataset/b9c8ce91-40ff-4ad3-8164-bc17c46afb44/resource/d5cd6a23-829c-426d-a63e-689a55a3db9c/download/beach-advisories.csv'

      - name: Fetch Safe to Swim CEDEN results for stormwater features
        run: |
          if [ ! -f data/raw/safetoswim_geomeans_2020-present.csv ]; then
            curl -fsSL -o data/raw/safetoswim_geomeans_2020-present.csv \
              'https://data.ca.gov/dataset/6723ab78-4530-4e97-ba5e-6ffd17a4c139/resource/15a63495-8d9f-4a49-b43a-3092ef3106b9/download/safetoswim_geomeans_2020-present.csv'
          fi

      - name: Run data pipeline
        run: |
          python -m app.data.pipeline.cli \
            --normalize-beachwatch \
            --stations-csv /tmp/bw_stations.csv \
            --results-csv /tmp/bw_results.csv \
            --advisories-csv /tmp/bw_advisories.csv \
            --merge-ceden \
            --max-ceden-rows 50000 \
            --force-ceden-fetch \
            --with-external-covariates \
            --with-hydrology \
            --with-solar-wind
        working-directory: backend

      - name: Fetch county-direct advisories (overrides stale state feed)
        # The data.ca.gov BeachWatch dataset lags county postings by weeks.
        # This step scrapes the SD County DEH page (sdbeachinfo.com) for live
        # postings and rewrites advisories.parquet's "active" records for any
        # beach the county currently has posted. Must run AFTER the state
        # ingest (which writes advisories.parquet) and BEFORE training (which
        # consumes it as a feature).
        #
        # G.1: this step is NOT continue-on-error. The script self-fails (exit 1)
        # only when its name-resolution observability gate trips (unresolved
        # advisories > 5 absolute OR > 10% of scraped). Transient per-county
        # HTTP failures are absorbed inside the script's RetryingClient and the
        # CountyReport telemetry, so the only way the script returns non-zero
        # is the explicit operability signal we want to surface.
        run: |
          python scripts/fetch_county_advisories.py --curated ../data/curated/
        working-directory: backend

      - name: Run stormwater/outfall feature pipeline
        # External ArcGIS endpoints (e.g. Orange County) occasionally return 500/503.
        # Don't fail the whole daily pipeline over a transient upstream outage —
        # cached parquets from the previous run carry the model through.
        continue-on-error: true
        run: |
          python -m app.data.pipeline.stormwater \
            --curated-dir ../data/curated \
            --raw-dir ../data/raw/stormwater \
            --download \
            --ceden-results-csv ../data/raw/safetoswim_geomeans_2020-present.csv
        working-directory: backend

      - name: Run ML training + forecasts
        run: |
          FORECAST_DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          python -m app.ml.training --curated --forecast-date "$FORECAST_DATE" --winner-only --spatial-backtests --spatial-strategy shortlist --spatial-beach-limit 50 --spatial-county-limit 12 --training-window-days 365 --forecast-min-recency-days 45
        working-directory: backend

      - name: Forecast-time weather pull (100% wind/UV coverage)
        run: |
          FORECAST_DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          python scripts/refresh_latest_env_weather.py --forecast-date "$FORECAST_DATE"
        working-directory: backend
        continue-on-error: true

      - name: Audit forecasts vs advisories
        run: |
          python scripts/audit_forecasts_vs_advisories.py \
            --curated ../data/curated/
        working-directory: backend

      - name: Audit gate — fail on zombie active advisories (G.4)
        # G.2's auto-expire (in serving_snapshot) should keep this at zero.
        # If it doesn't, something is wrong with the demote pipeline — fail
        # the workflow so we notice before the bad data ships to prod.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          audit_path = Path("../data/curated/advisory_audit.json")
          if not audit_path.exists():
              print("advisory_audit.json not produced; skipping G.4 gate")
              sys.exit(0)
          audit = json.loads(audit_path.read_text())

          zombies = []
          # The audit JSON ships per-pool sample rows under
          # false_negatives.worst_acute / worst_chronic. We scan every list
          # of rows that carries advisory_age_days and count anything > 30d.
          fn = audit.get("false_negatives") or {}
          for key in ("worst_acute", "worst_chronic"):
              for row in (fn.get(key) or []):
                  age = row.get("advisory_age_days")
                  if isinstance(age, (int, float)) and age > 30:
                      zombies.append(row)

          if zombies:
              print("FAIL (G.4): zombie active advisories with age_days > 30 detected:", file=sys.stderr)
              for z in zombies[:20]:
                  print(f"  beach_id={z.get('beach_id')} age_days={z.get('advisory_age_days')} pool={z.get('pool')}", file=sys.stderr)
              print(
                  f"\nG.2 auto-expire should have demoted these. "
                  f"Inspect serving_snapshot.auto_expire_zombie_advisories logs to debug.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("G.4 gate passed: no zombie active advisories above 30d.")
          PY
        working-directory: backend

      - name: Build API serving snapshot
        run: python -m app.data.pipeline.serving_snapshot --curated ../data/curated/
        working-directory: backend

      # Web static data baking moved to kylechoi101/shorelife-web private repo.
      # That repo's CI pulls data/curated/ from this public repo via the
      # GitHub raw URL and bakes its own static export.

      - name: Verify public release gates
        run: python scripts/verify_public_release.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/curated/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            FORECAST_DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
            git commit -m "chore: daily forecast refresh ${FORECAST_DATE}"
            # -X theirs: on rebase, "theirs" = our local commit. Binary files
            # like serving.sqlite can't auto-merge — always prefer the freshly
            # regenerated version produced by this pipeline run.
            git pull --rebase --autostash -X theirs origin main
            git push
          fi

      - name: Trigger Render deploy
        if: success()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK not set — skipping (set repo secret to enable)."
          fi
