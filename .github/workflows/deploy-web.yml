name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/curated/forecasts.parquet'
      - 'data/curated/system_health.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate forecast summary
        run: |
          pip install pandas pyarrow --quiet
          python -c "
          import pandas as pd, json
          df = pd.read_parquet('data/curated/forecasts.parquet')
          rows = df[['beach_id','risk_band','p_exceed','wave_height_m','water_temperature_c']].copy()
          rows['p_exceed'] = rows['p_exceed'].round(4)
          rows['wave_height_m'] = rows['wave_height_m'].round(2)
          rows['water_temperature_c'] = rows['water_temperature_c'].round(2)
          out = rows.to_dict(orient='records')
          with open('web/public/forecast_summary.json','w') as f:
              json.dump(out, f, separators=(',',':'))
          print(f'Wrote {len(out)} rows to web/public/forecast_summary.json')
          "

      - uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build static export
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://surf-health-api.onrender.com

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
