name: Hourly closures feed

on:
  schedule:
    - cron: '0 * * * *'   # top of every hour
  workflow_dispatch:

# Pools currently-active beach closures into a tiny public feed
# (data/curated/closures.json). The mobile app fetches it on a background
# schedule and does the proximity check + dedup ON-DEVICE — no user data,
# push tokens, or locations are stored server-side.
jobs:
  closures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (base only — no training extras)
        run: pip install -e .
        working-directory: backend

      - name: Scrape live county advisories
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Non-fatal: a flaky county source must not block the feed; we still
        # rebuild from whatever advisories.parquet currently holds.
        run: python scripts/fetch_county_advisories.py || echo "[warn] advisory scrape had errors; building feed from current data"

      - name: Build closures.json feed
        working-directory: backend
        run: python scripts/refresh_closures.py

      - name: Commit feed if changed
        run: |
          git config user.name "shorelife-bot"
          git config user.email "bot@shorelife.app"
          # Only the public feed — never the re-scraped advisories.parquet
          # (that belongs to the daily pipeline; avoids churn/conflicts).
          #
          # The daily/scraper bots push to main concurrently, so our push can be
          # rejected (non-fast-forward). We must NOT `git pull --rebase` here: a
          # concurrent run edits the SAME file (closures.json), so the rebase
          # hits a content conflict, drops into a detached/unmerged state, and
          # every retry then fails ("Pulling is not possible... unmerged files").
          #
          # Instead, each attempt re-bases our freshly-built feed on top of the
          # latest origin/main by reset+reapply. There is nothing to merge — our
          # just-generated feed simply wins (it reflects this run's scrape, which
          # is at least as fresh as any concurrent run's), so no conflict is
          # possible no matter how many bots race us.
          ours="$RUNNER_TEMP/closures.ours.json"
          cp data/curated/closures.json "$ours"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$ours" data/curated/closures.json
            git add -f data/curated/closures.json
            if git diff --cached --quiet; then
              echo "no closure changes"; exit 0
            fi
            git commit -m "chore(closures): hourly feed refresh [skip ci]"
            if git push; then echo "pushed (attempt $attempt)"; exit 0; fi
            echo "push rejected, re-basing on latest main (attempt $attempt)"
          done
          echo "::error::could not push closures feed after retries"; exit 1
