name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Real runs finish in ~3 minutes. On 2026-08-06 a docs-only commit hung for
    # ~16 minutes and was cancelled runner-side, which surfaces as a bare
    # "failure" with zero failed jobs — indistinguishable at a glance from a
    # genuine test break. With no timeout a hang can burn the 6-hour default
    # before GitHub kills it. 20 minutes is ~6x headroom over the real runtime
    # and turns a stall into a fast, clearly-labelled timeout.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        # -c constraints.txt pins the portable scientific stack to the
        # last-validated daily-run versions (matches daily-forecast.yml), so CI
        # tests against the same numpy/pandas/scikit-learn/xgboost the daily
        # retrain uses. Relative path resolves under working-directory.
        run: pip install -e ".[dev,training]" -c constraints.txt
        working-directory: backend

      - name: Ruff
        run: ruff check app tests scripts ../scripts/verify_public_release.py
        working-directory: backend

      - name: Pytest
        run: pytest
        working-directory: backend

      - name: Public release gates
        run: python scripts/verify_public_release.py
        continue-on-error: true

  # web/ and mobile/ have moved to private repos:
  #   kylechoi101/shorelife-web
  #   kylechoi101/shorelife-mobile
  # Each runs its own CI within those repos.
