name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev,training]"
        working-directory: backend

      - name: Ruff
        run: ruff check app tests scripts ../scripts/verify_public_release.py
        working-directory: backend

      - name: Pytest
        run: pytest
        working-directory: backend

      - name: Public release gates
        run: python scripts/verify_public_release.py
        continue-on-error: true

  # web/ and mobile/ have moved to private repos:
  #   kylechoi101/shorelife-web
  #   kylechoi101/shorelife-mobile
  # Each runs its own CI within those repos.
