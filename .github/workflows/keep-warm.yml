name: Keep Render warm

# Render free tier spins the API down after 15 minutes of no traffic,
# then takes ~50 seconds to wake on the next request — that's a bounced
# session for the first user. This workflow pings /system/health every
# 5 minutes so the service stays warm.
#
# GitHub Actions cron has best-effort scheduling and can drift 5–10 min
# under load. Two offset schedules give us redundancy: if the */5 firing
# is delayed, the other one is likely to land first. Worst-case interval
# stays well under Render's 15-minute spin-down threshold.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /system/health
        run: |
          # --max-time 90s tolerates the 50s cold start.
          # -f turns 4xx/5xx into failures so the workflow surfaces real outages.
          # We accept a 503 (model not eligible / pipeline stale) as "service is
          # up and routing correctly" — that's not a wake-up failure.
          status=$(curl -s -o /tmp/body.json -w "%{http_code}" --max-time 90 \
            https://surf-health-api.onrender.com/system/health)
          echo "HTTP $status"
          if [ "$status" = "200" ] || [ "$status" = "503" ]; then
            echo "Service responding."
            exit 0
          fi
          echo "Unexpected response:"
          cat /tmp/body.json || true
          exit 1
