name: Deploy backend to Render

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "render.yaml"
      - "backend/**"
      - "data/curated/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Never kill a mid-flight deploy — let it finish and queue the next one.
# cancel-in-progress: false avoids tearing down an in-progress Render webhook
# + health-check sequence (which would leave the GitHub deployment record stuck
# in `in_progress`).
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Create GitHub deployment record
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          DEPLOYMENT_ID=$(gh api \
            -X POST \
            "repos/$REPO/deployments" \
            -f ref="$SHA" \
            -f environment="main - surf-health-api" \
            -f description="Render deploy webhook triggered by GH Actions" \
            -F auto_merge=false \
            -F production_environment=true \
            -f "required_contexts[]" \
            --jq '.id')
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=in_progress \
            -f description="Posting to Render deploy hook"

      - name: Trigger Render deploy
        id: trigger
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not set; skipping Render deploy."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered."

      - name: Wait for Render deploy to become healthy
        # The Render webhook is fire-and-forget: a failed Render BUILD ships
        # nothing and nobody notices. Poll the public health endpoint until it
        # returns 200, then mark the deployment healthy. Render free-tier cold
        # starts are slow, so the budget is generous: 15 tries x 20s = ~5 min.
        # Guarded by the same RENDER_DEPLOY_HOOK presence check as the webhook
        # step so PRs/forks (no secret) don't fail — if we never POSTed a
        # deploy, there is nothing to health-check.
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not set; no deploy was triggered, skipping health check."
            exit 0
          fi
          HEALTH_URL="https://surf-health-api-aabr.onrender.com/system/health"
          ATTEMPTS=15
          SLEEP_SECS=20
          for i in $(seq 1 "$ATTEMPTS"); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTH_URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Render deploy healthy: $HEALTH_URL returned 200 (attempt $i/$ATTEMPTS)."
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS: $HEALTH_URL returned HTTP $CODE — retrying in ${SLEEP_SECS}s..."
            sleep "$SLEEP_SECS"
          done
          echo "::error::Render deploy did not become healthy — check Render dashboard. $HEALTH_URL never returned 200 after $((ATTEMPTS * SLEEP_SECS))s."
          exit 1

      - name: Mark deployment success
        if: success() && steps.deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          gh api -X POST "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=success \
            -f environment_url=https://surf-health-api-aabr.onrender.com \
            -f description="Render webhook accepted; Render is rebuilding"

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          gh api -X POST "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=failure \
            -f description="Render webhook POST failed (curl error)"
