services:
  # The FastAPI Backend + Background ML Pipeline
  - type: web
    name: surf-health-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: us-west
    plan: starter
    disk:
      name: surf-health-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: WORKSPACE_DIR
        value: /data
