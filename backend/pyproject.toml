[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surf-health-backend"
version = "0.1.0"
description = "California marine beach health forecasting backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "numpy>=2.1.0,<3",
  "orjson>=3.10.0",
  "pandas>=2.2.0,<4",
  "pyarrow>=17.0.0,<25",
  "pydantic-settings>=2.6.0",
  "rapidfuzz>=3.14.0",
  "python-dateutil>=2.9.0",
  "python-dotenv>=1.0.1",
  "scikit-learn>=1.5.0,<2",
  "slowapi>=0.1.9",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
# training extras: pipeline + ML training only; never runs on the API server.
# Install with `pip install -e ".[training]"` in GitHub Actions.
training = [
  "duckdb>=1.1.3,<2",
  "psycopg[binary]>=3.2.0,<4",
  "sqlalchemy>=2.0.36,<3",
  "torch>=2.5.0,<3",
  "xgboost>=2.1.0,<4",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
