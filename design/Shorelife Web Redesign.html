<title>Shorelife — Web Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,450;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
:root {
  /* Brand */
  --sl-navy:        #0b4266;
  --sl-navy-deep:   #072e48;
  --sl-navy-ink:    #051d2e;
  --sl-teal:        #4dd5a8;
  --sl-teal-deep:   #2b9e79;
  --sl-sun:         #d99a2b;          /* travel-poster mustard sun */
  --sl-sun-deep:    #a06a13;

  /* Earth neutrals */
  --sl-ecru:        #f1ead9;          /* page bg — warmer */
  --sl-ecru-deep:   #e9dfc6;
  --sl-bone:        #faf6ee;
  --sl-sand:        #e8dfcc;
  --sl-driftwood:   #c9b997;
  --sl-kelp:        #2a3d32;

  --sl-ink:         #1a2730;
  --sl-muted:       #5e6b73;
  --sl-line:        #d6cbb1;
  --sl-line-soft:   #e6dcc4;

  /* Risk */
  --sl-risk-low:    #2b9e79;
  --sl-risk-low-bg: #d8efe4;
  --sl-risk-low-ink:#175d43;
  --sl-risk-mod:    #c99b2d;
  --sl-risk-mod-bg: #f3e6c1;
  --sl-risk-mod-ink:#6d4a05;
  --sl-risk-high:   #c7552e;
  --sl-risk-high-bg:#f2d9ca;
  --sl-risk-high-ink:#7a2d15;
  --sl-risk-vh:     #8a2a20;
  --sl-risk-vh-bg:  #ecc9c1;
  --sl-risk-vh-ink: #561611;

  /* Type */
  --sl-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --sl-text:    'Inter', -apple-system, system-ui, sans-serif;
  --sl-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--sl-ecru);
  color: var(--sl-ink);
  font-family: var(--sl-text);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.005em;
}

/* Subtle paper grain on body */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(217,154,43,0.05), transparent 28%),
    radial-gradient(circle at 88% 92%, rgba(11,66,102,0.04), transparent 32%);
}

/* Type */
.sl-display { font-family: var(--sl-display); font-weight: 450; letter-spacing: -0.02em; line-height: 1.0; }
.sl-mono    { font-family: var(--sl-mono); font-variant-numeric: tabular-nums; }
.sl-eyebrow { font-family: var(--sl-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--sl-muted); }
.sl-label   { font-family: var(--sl-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; }

/* Navigator — page picker chip strip at the very top */
.nav-bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 28px;
  background: rgba(241, 234, 217, 0.85);
  border-bottom: 1px solid var(--sl-line);
  backdrop-filter: blur(12px);
}
.nav-bar .nav-tag { font-family: var(--sl-mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--sl-muted); }
.nav-bar .nav-spacer { flex: 1; }
.nav-bar button {
  font-family: var(--sl-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 999px; border: 1px solid var(--sl-line);
  background: transparent; color: var(--sl-muted); cursor: pointer;
  transition: all .15s ease;
}
.nav-bar button:hover { color: var(--sl-navy); border-color: var(--sl-navy); }
.nav-bar button.is-active { background: var(--sl-navy); color: var(--sl-bone); border-color: var(--sl-navy); }

/* Page section wrapper */
.page-frame {
  position: relative;
  border-bottom: 1px dashed var(--sl-line);
  padding-bottom: 24px;
}
.page-frame:last-of-type { border-bottom: 0; }
.page-tag {
  position: absolute; top: 16px; left: 28px;
  font-family: var(--sl-mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--sl-muted);
  background: var(--sl-ecru); padding: 2px 8px;
}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
