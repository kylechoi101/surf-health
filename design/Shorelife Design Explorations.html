<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Shorelife — Logo, Risk System, Home Screen</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,450;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/foundations.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #efe8d8; font-family: 'Inter', system-ui, sans-serif; overscroll-behavior: none; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/beaches.js"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="frames/design-canvas.jsx"></script>

<script type="text/babel">
// Minimal shared icons used by the home screens
window.Icon = {
  location: (p) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" {...p}><path d="M12 21s-7-7.5-7-12a7 7 0 1 1 14 0c0 4.5-7 12-7 12Z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><circle cx="12" cy="9" r="2.5" stroke="currentColor" strokeWidth="1.8"/></svg>,
  chevron:  (p) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" {...p}><path d="m9 6 6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  search:   (p) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" {...p}><circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
};
</script>
<script type="text/babel" src="components/logo.jsx"></script>
<script type="text/babel" src="components/risk.jsx"></script>
<script type="text/babel" src="components/home.jsx"></script>

<script type="text/babel">
function Frame({ children }) {
  return <IOSDevice width={390} height={780} title="Shorelife">{children}</IOSDevice>;
}

// ─── Logo panel ────────────────────────────────────────────────────────────
function LogoPanel() {
  return (
    <div className="sl" style={{ padding: 32, background: 'var(--sl-ecru)', width: 1240 }}>
      <div style={{ marginBottom: 22 }}>
        <div className="sl-eyebrow">01 · Identity</div>
        <div className="sl-display" style={{ fontSize: 28, color: 'var(--sl-navy)', marginTop: 6 }}>
          shorelife
        </div>
        <div style={{ fontSize: 13, color: 'var(--sl-muted)', marginTop: 6, maxWidth: 600, lineHeight: 1.5 }}>
          Wave curl S-monogram — no sun. Upper curve is the cresting wave; lower curve is the wet-sand
          shoreline. Where wave meets sand, the two arcs connect into a single S. Wordmark is Fraunces
          display 500, clean and unmanipulated.
        </div>
      </div>

      {/* Primary vertical lockups */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 16, marginBottom: 16 }}>
        <div style={{ padding: 32, background: 'var(--sl-bone)', border: '1px solid var(--sl-line)',
          borderRadius: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 300 }}>
          <LockupVertical size={36}/>
        </div>
        <div style={{ padding: 32, background: 'var(--sl-navy)', border: '1px solid var(--sl-navy-deep)',
          borderRadius: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 300 }}>
          <LockupVertical size={36} ink="#f4efe6" sand="#c9b997" water="#4dd5a8"/>
        </div>
        <div style={{ padding: 32, background: '#2a3d32', border: '1px solid #1f3025',
          borderRadius: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 300 }}>
          <LockupVertical size={36} ink="#f4efe6" sand="#c9b997" water="#4dd5a8"/>
        </div>
      </div>

      {/* Horizontal for nav bar */}
      <div style={{ padding: 24, background: 'var(--sl-bone)', border: '1px solid var(--sl-line)',
        borderRadius: 16, marginBottom: 22, display: 'flex', alignItems: 'center',
        justifyContent: 'space-between' }}>
        <div className="sl-eyebrow">Horizontal · nav-bar use</div>
        <LockupHorizontal size={32}/>
      </div>

      {/* App icons + 40px tests */}
      <div style={{ padding: 24, background: 'var(--sl-bone)', border: '1px solid var(--sl-line)',
        borderRadius: 16 }}>
        <div className="sl-eyebrow" style={{ marginBottom: 16 }}>App icon · tested at 40px</div>
        <div style={{ display: 'flex', gap: 28, justifyContent: 'space-around', flexWrap: 'wrap' }}>
          <AppIconCell bg="#f4efe6" ink="#0b4266" label="Ecru · primary"/>
          <AppIconCell bg="#0b4266" ink="#f4efe6" label="Navy"/>
          <AppIconCell bg="#2a3d32" ink="#f4efe6" water="#4dd5a8" label="Kelp"/>
          <AppIconCell bg="#c99b2d" ink="#051d2e" label="Sun"/>
          <AppIconCell bg="#4dd5a8" ink="#0b4266" label="Teal"/>
        </div>
      </div>
    </div>
  );
}

// ─── Color + type swatch panel ─────────────────────────────────────────────
function FoundationsPanel() {
  const colors = [
    { n: 'Navy',      v: '#0b4266', l: 'Primary ink, nav' },
    { n: 'Navy deep', v: '#072e48', l: 'Headers on light' },
    { n: 'Teal',      v: '#4dd5a8', l: 'Accent, go-signal' },
    { n: 'Sun',       v: '#c99b2d', l: 'Warm accent' },
    { n: 'Ecru',      v: '#f4efe6', l: 'Page background' },
    { n: 'Bone',      v: '#faf6ee', l: 'Surface / card' },
    { n: 'Sand',      v: '#e8dfcc', l: 'Secondary bg' },
    { n: 'Driftwood', v: '#c9b997', l: 'Muted accent' },
    { n: 'Kelp',      v: '#2a3d32', l: 'Dark neutral' },
    { n: 'Line',      v: '#dcd3c0', l: 'Hairline' },
  ];
  const risks = [
    { n: 'Low',       v: '#2b9e79' },
    { n: 'Moderate',  v: '#c99b2d' },
    { n: 'High',      v: '#c7552e' },
    { n: 'Very High', v: '#8a2a20' },
  ];
  return (
    <div className="sl" style={{ padding: 32, background: 'var(--sl-ecru)', width: 1240 }}>
      <div style={{ marginBottom: 22 }}>
        <div className="sl-eyebrow">02 · Foundations</div>
        <div className="sl-display" style={{ fontSize: 28, color: 'var(--sl-navy)', marginTop: 6 }}>
          Earthy neutrals, deep navy, intentional warmth.
        </div>
        <div style={{ fontSize: 13, color: 'var(--sl-muted)', marginTop: 6, maxWidth: 620, lineHeight: 1.5 }}>
          Fraunces for display (outdoorsy serif), Inter for body, JetBrains Mono for data readouts.
          Risk colors are seafoam → mustard → rust → oxblood — not a traffic light.
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '5fr 3fr', gap: 16 }}>
        <div style={{ padding: 20, background: 'var(--sl-bone)', border: '1px solid var(--sl-line)',
          borderRadius: 16 }}>
          <div className="sl-eyebrow" style={{ marginBottom: 12 }}>Brand + neutrals</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 10 }}>
            {colors.map(c => (
              <div key={c.n}>
                <div style={{ height: 72, borderRadius: 10, background: c.v, border: '1px solid rgba(0,0,0,0.06)' }}/>
                <div style={{ fontSize: 12, fontWeight: 600, marginTop: 6 }}>{c.n}</div>
                <div className="sl-mono" style={{ fontSize: 10, color: 'var(--sl-muted)' }}>{c.v}</div>
                <div style={{ fontSize: 10, color: 'var(--sl-muted)', marginTop: 2 }}>{c.l}</div>
              </div>
            ))}
          </div>

          <div className="sl-eyebrow" style={{ margin: '20px 0 10px' }}>Risk</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
            {risks.map(c => (
              <div key={c.n}>
                <div style={{ height: 54, borderRadius: 10, background: c.v }}/>
                <div style={{ fontSize: 12, fontWeight: 600, marginTop: 6 }}>{c.n}</div>
                <div className="sl-mono" style={{ fontSize: 10, color: 'var(--sl-muted)' }}>{c.v}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ padding: 20, background: 'var(--sl-bone)', border: '1px solid var(--sl-line)',
          borderRadius: 16 }}>
          <div className="sl-eyebrow" style={{ marginBottom: 12 }}>Type</div>
          <div className="sl-display" style={{ fontSize: 64, color: 'var(--sl-navy)', lineHeight: 0.95 }}>
            Clean.
          </div>
          <div className="sl-display" style={{ fontSize: 26, color: 'var(--sl-navy)', marginTop: 4 }}>
            Swim, surf, dunk under.
          </div>
          <div style={{ fontSize: 13, color: 'var(--sl-muted)', marginTop: 16, lineHeight: 1.5, maxWidth: 320 }}>
            Enterococcus counts are within the safe threshold and have been for 21 consecutive days.
            No onshore wind pushing runoff, tide is high.
          </div>
          <div className="sl-mono" style={{ fontSize: 13, marginTop: 16, color: 'var(--sl-ink)' }}>
            &lt; 35 CFU / 100mL · 21D STABLE
          </div>

          <hr className="sl-hr" style={{ margin: '20px 0' }}/>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <div><span className="sl-label" style={{ color: 'var(--sl-muted)' }}>Display · </span>
              <span style={{ fontFamily: 'var(--sl-display)', fontSize: 15 }}>Fraunces · 450 / 500</span></div>
            <div><span className="sl-label" style={{ color: 'var(--sl-muted)' }}>Text · </span>
              <span style={{ fontSize: 13 }}>Inter · 400 / 500 / 600</span></div>
            <div><span className="sl-label" style={{ color: 'var(--sl-muted)' }}>Mono · </span>
              <span className="sl-mono" style={{ fontSize: 13 }}>JetBrains Mono · 500</span></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  // Augment with a synthetic dist field if not present (design/data/beaches.js omits it)
  const beaches = window.BEACHES.map((b, i) => ({
    dist: parseFloat((1.2 + i * 0.7).toFixed(1)),
    ...b,
  }));
  const low  = beaches.find(b => b.risk === 'Low');
  const mod  = beaches.find(b => b.risk === 'Moderate');
  const high = beaches.find(b => b.risk === 'High');
  const vh   = beaches.find(b => b.risk === 'Very High');
  const nearby = beaches;

  return (
    <DesignCanvas>
      <DCSection id="identity" title="Identity" subtitle="Logo lockups + 40px app icon">
        <DCArtboard id="logo" label="Logo system" width={1280} height={820}>
          <LogoPanel/>
        </DCArtboard>
      </DCSection>

      <DCSection id="foundations" title="Foundations" subtitle="Color + type">
        <DCArtboard id="foundations" label="Tokens" width={1280} height={560}>
          <FoundationsPanel/>
        </DCArtboard>
      </DCSection>

      <DCSection id="risk" title="Risk system" subtitle="Four bands · the full vocabulary">
        <DCArtboard id="risk-poster" label="Four bands × three treatments" width={1280} height={1080}>
          <RiskSystemPoster/>
        </DCArtboard>
      </DCSection>

      <DCSection id="home" title="Home screen · shoreline cross-section" subtitle="Four variants of the same metaphor">
        <DCArtboard id="home-a" label="A · Hero cross-section (High — Manhattan)" width={430} height={820}>
          <Frame><HomeVariantA beach={high} nearby={nearby}/></Frame>
        </DCArtboard>
        <DCArtboard id="home-b" label="B · Answer-first + strip (Low — Malibu)" width={430} height={820}>
          <Frame><HomeVariantB beach={low} nearby={nearby}/></Frame>
        </DCArtboard>
        <DCArtboard id="home-c" label="C · Full-bleed diagrammatic (Moderate — Scripps)" width={430} height={820}>
          <Frame><HomeVariantC beach={mod} nearby={nearby}/></Frame>
        </DCArtboard>
        <DCArtboard id="home-d" label="D · Field guide (Very High — Imperial)" width={430} height={820}>
          <Frame><HomeVariantD beach={vh} nearby={nearby}/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="home-same-var" title="Same variant · all four risk bands" subtitle="How Variant A behaves across the system">
        <DCArtboard id="same-low"  label="Low — Malibu"       width={430} height={820}>
          <Frame><HomeVariantA beach={low}  nearby={nearby}/></Frame>
        </DCArtboard>
        <DCArtboard id="same-mod"  label="Moderate — Scripps" width={430} height={820}>
          <Frame><HomeVariantA beach={mod}  nearby={nearby}/></Frame>
        </DCArtboard>
        <DCArtboard id="same-high" label="High — Manhattan"   width={430} height={820}>
          <Frame><HomeVariantA beach={high} nearby={nearby}/></Frame>
        </DCArtboard>
        <DCArtboard id="same-vh"   label="Very High — Imperial" width={430} height={820}>
          <Frame><HomeVariantA beach={vh}   nearby={nearby}/></Frame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
